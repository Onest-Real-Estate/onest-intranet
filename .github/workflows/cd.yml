name: CD

# Deploys to the VPS after CI succeeds on a push to a deploy branch.
# Does not run for pull_request CI runs.
#
# Required repository secrets:
#   DEPLOY_HOST      — VPS hostname or IP
#   DEPLOY_USER      — SSH user
#   DEPLOY_SSH_KEY   — private key (PEM) with access to the VPS
#   DEPLOY_PATH      — absolute path to the repo checkout on the VPS
#
# Optional:
#   DEPLOY_PORT      — SSH port (default 22)
#   DEPLOY_ENV_FILE  — compose env file on the VPS (default .env.prod)
#
# The deploy user must have passwordless sudo for:
#   systemctl restart docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && contains(fromJSON('["main","staging"]'), github.event.workflow_run.head_branch)
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,DEPLOY_BRANCH,DEPLOY_SHA,DEPLOY_ENV_FILE
          script_stop: true
          script: |
            set -euo pipefail

            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "DEPLOY_PATH secret is not set" >&2
              exit 1
            fi

            ENV_FILE="${DEPLOY_ENV_FILE:-.env.prod}"
            cd "$DEPLOY_PATH"

            echo "Deploying ${DEPLOY_BRANCH}@${DEPLOY_SHA}"

            git fetch --prune origin
            # Deploy the exact commit CI tested, not whatever is tip of the branch.
            git checkout --force "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing env file: $DEPLOY_PATH/$ENV_FILE" >&2
              exit 1
            fi

            # Rebuild images, then bounce dockerd so every container comes back
            # under the new image (restart: unless-stopped). Requires passwordless
            # sudo for systemctl on the deploy user.
            docker compose --env-file "$ENV_FILE" \
              -f deployment/compose.prod.yaml \
              up -d --build --remove-orphans

            sudo systemctl restart docker

            # Wait until the daemon is accepting commands again.
            for _ in $(seq 1 30); do
              if docker info >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            docker info >/dev/null

            docker compose --env-file "$ENV_FILE" \
              -f deployment/compose.prod.yaml \
              ps
