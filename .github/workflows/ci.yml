name: CI

on:
  push:
    branches: [main, staging, development]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Pre-commit (.husky/pre-commit) runs lint, types, and migration drift only.
# This workflow adds the slow suites that stay out of the local hook:
#   uv run pytest   # -n auto --reuse-db via pyproject.toml addopts
#   pnpm test
# Plus the same lint/type/migration checks as pre-commit (minus lint-staged).
#
# Backend runs only when Python (or its toolchain) changes.
# Frontend runs only when TypeScript (or its toolchain) changes.
# Editing this workflow re-runs both so the new gates stay covered.

jobs:
  changes:
    name: Detect file changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci.yml'
            frontend:
              - '**/*.ts'
              - '**/*.tsx'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'biome.json'
              - 'components.json'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (ruff · ty · pytest · migrations)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Tests (pytest)
        run: uv run pytest

      - name: Migrations up to date
        run: uv run python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend (typecheck · biome)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc)
        run: pnpm typecheck

      - name: Tests (vitest)
        run: pnpm test

      - name: Lint + format (biome)
        run: pnpm exec biome check .

  ci:
    name: CI
    needs: [changes, backend, frontend]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [ "${{ needs.backend.result }}" != "success" ] \
            && [ "${{ needs.backend.result }}" != "skipped" ]; then
            echo "Backend failed: ${{ needs.backend.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend.result }}" != "success" ] \
            && [ "${{ needs.frontend.result }}" != "skipped" ]; then
            echo "Frontend failed: ${{ needs.frontend.result }}"
            exit 1
          fi
