name: onest-dev

# Development stack. Django runs in the container with the code bind-mounted
# for hot reload; the Vite dev server runs on the host (`pnpm run dev`).
#
#   docker compose --env-file .env -f deployment/compose.dev.yaml up -d
#   pnpm run dev   # on the host, for HMR
#
# Services: web (Django) · db (PostgreSQL) · redis · mailpit · minio (S3)
#          · celery (workers) · celery-beat (django-celery-beat scheduler)
#          · docuseal (document signing)

# Shared config for the celery worker and beat services (dev image: code
# bind-mounted, deps in the venv volume, PostgreSQL + Redis from the stack).
x-celery-service: &celery-service
  build:
    context: ..
    dockerfile: deployment/Containerfile.dev
  restart: unless-stopped
  volumes:
    - ..:/app
  environment: &celery-env
    DJANGO_DEBUG: "1"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret}
    # PostgreSQL (tasks may touch the database)
    DB_ENGINE: django.db.backends.postgresql
    DB_NAME: onest
    DB_USER: onest
    DB_PASSWORD: onest
    DB_HOST: db
    DB_PORT: "5432"
    # Redis: db 0 is the cache; celery uses dedicated DBs (see settings)
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    # Object storage — must match the web service exactly. Tasks read back the
    # bytes a request wrote: announcement media is uploaded by web and then
    # verified, stripped, and resized here. Without these the worker falls back
    # to local-disk storage, looks for a key that only exists in MinIO, and
    # fails every file with "The stored file could not be read".
    USE_S3: "1"
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    AWS_STORAGE_BUCKET_NAME: onest
    AWS_S3_ENDPOINT_URL: http://minio:9000
    AWS_S3_CUSTOM_DOMAIN: localhost:${MINIO_S3_PORT:-9000}
    AWS_S3_URL_PROTOCOL: "http:"
    AWS_S3_REGION_NAME: us-east-1
    AWS_S3_ADDRESSING_STYLE: path
    # Error tracking (Sentry SDK)
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-0}
    LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    build:
      context: ..
      dockerfile: deployment/Containerfile.dev
    command: ./deployment/entrypoint.dev.sh
    volumes:
      - ..:/app
      - venv:/app/.venv
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      # PostgreSQL
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: onest
      DB_USER: onest
      DB_PASSWORD: onest
      DB_HOST: db
      DB_PORT: "5432"
      # Redis (cache + sessions)
      REDIS_URL: redis://redis:6379/0
      # Celery — the *web* process is a producer: every task queued from a
      # request (announcement media processing, notification fan-out, audit
      # event dispatch) is enqueued here. Without these it falls back to the
      # settings default of redis://localhost:6379/1, which inside this
      # container is nothing at all, and `.delay()` dies on connection
      # refused. Must match the celery service's values or the worker consumes
      # a different queue than the one being written to.
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      # Email via Mailpit (web UI: http://localhost:8025)
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      # Object storage via MinIO (S3). boto3 uploads over the compose network
      # (minio:9000); browsers fetch media via the published port
      # (localhost:9000) using public URLs (minio-init applies an anonymous
      # download policy). If you change MINIO_S3_PORT, mirror it here.
      USE_S3: "1"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_STORAGE_BUCKET_NAME: onest
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_CUSTOM_DOMAIN: localhost:${MINIO_S3_PORT:-9000}
      AWS_S3_URL_PROTOCOL: "http:"
      AWS_S3_REGION_NAME: us-east-1
      # MinIO only supports path-style addressing (settings.py defaults to
      # virtual-hosted style for AWS S3).
      AWS_S3_ADDRESSING_STYLE: path
      # Microsoft SSO
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      # Error tracking (Sentry SDK)
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-0}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: onest
      POSTGRES_PASSWORD: onest
      POSTGRES_DB: onest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onest -d onest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web UI

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_S3_PORT:-9000}:9000"     # S3 API (used for media URLs)
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console

  celery:
    <<: *celery-service
    command: ./deployment/entrypoint.celery.sh worker -l info
    volumes:
      - ..:/app
      - celery_venv:/app/.venv

  celery-beat:
    <<: *celery-service
    command: ./deployment/entrypoint.celery.sh beat -l info
    volumes:
      - ..:/app
      - celery_beat_venv:/app/.venv

  # DocuSeal — self-hosted document signing (e-signatures). SQLite-backed by
  # default; data persists in the docuseal_data volume. Web UI + API:
  # http://localhost:${DOCUSEAL_PORT:-3000} (initial account is created on
  # first visit).
  docuseal:
    image: docuseal/docuseal:latest
    restart: unless-stopped
    environment:
      # Used to build absolute links (e.g. in signing emails). If you change
      # DOCUSEAL_PORT, mirror it here.
      HOST: localhost:${DOCUSEAL_PORT:-3000}
    volumes:
      - docuseal_data:/data
    ports:
      - "${DOCUSEAL_PORT:-3000}:3000"

  # One-shot: waits for MinIO, creates the bucket, and makes it publicly
  # readable so browsers can fetch media URLs built from AWS_S3_CUSTOM_DOMAIN.
  # Idempotent; safe to re-run on every `docker compose up`.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: onest
    entrypoint: |
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
        echo "minio-init: waiting for MinIO ..."
        sleep 2
      done
      mc mb --ignore-existing "local/$$MINIO_BUCKET"
      mc anonymous set download "local/$$MINIO_BUCKET"
      echo "minio-init: bucket $$MINIO_BUCKET ready (public read)"
      '

volumes:
  postgres_data:
  venv:
  celery_venv:
  celery_beat_venv:
  minio_data:
  docuseal_data:
